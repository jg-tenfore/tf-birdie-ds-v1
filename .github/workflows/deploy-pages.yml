name: Build, test & deploy

# Pull requests run every check (lint, typecheck, build, smoke) so a broken
# branch is caught before merge. Only a push to main deploys to Pages.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# A new push to a PR cancels that PR's in-flight run. Runs on main are never
# cancelled — each one is a deploy.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            # Builds Storybook into dist/storybook, then assembles the landing
            # page, logos, and any prototypes around it in dist/.
            - name: Build site
              run: npm run build

            # The only check that verifies the prototype actually works rather
            # than merely compiles. It runs against the built site on the real
            # /tf-birdie-ds-v1/ base path, so a broken asset path fails here
            # instead of on the deployed page.
            - name: Smoke test the built prototype
              run: npx playwright install --with-deps chromium && node scripts/serve-dist.mjs --smoke

            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        # One deployment at a time; don't cancel an in-progress deploy.
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
